<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>奥莱海外仓</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: "PingFang SC","Microsoft YaHei",sans-serif;
      background:#f5f5f5;
      color:#222;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    .container{
      width:1200px;
      margin:0 auto;
    }

    /* 顶部Banner */
    .hero{
      background:
      linear-gradient(rgba(255,255,255,.92),rgba(255,255,255,.92)),
      url('https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?q=80&w=1600&auto=format&fit=crop');
      background-size:cover;
      background-position:center;
      padding:80px 0 70px;
    }

    .title{
      text-align:center;
      font-size:72px;
      font-weight:700;
      letter-spacing:8px;
      margin-bottom:45px;
      color:#1f1a17;
    }

    .features{
      display:flex;
      justify-content:center;
      gap:50px;
      margin-bottom:60px;
    }

    .feature-item{
      display:flex;
      align-items:center;
      gap:16px;
      padding:10px 20px;
    }

    .feature-icon{
      width:52px;
      height:52px;
      border:2px solid #b08b57;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      color:#b08b57;
    }

    .feature-text h4{
      font-size:30px;
      margin-bottom:6px;
      font-weight:600;
    }

    .feature-text p{
      font-size:14px;
      color:#666;
    }

    .section-title{
      text-align:center;
      font-size:42px;
      font-weight:700;
      margin-bottom:40px;
      position:relative;
    }

    .section-title::before,
    .section-title::after{
      content:'';
      width:90px;
      height:1px;
      background:#999;
      position:absolute;
      top:50%;
    }

    .section-title::before{
      left:36%;
    }

    .section-title::after{
      right:36%;
    }

    /* 商品区域 */
    .product-list{
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:22px;
    }

    .product-card{
      background:#fff;
      border-radius:22px;
      overflow:hidden;
      transition:.3s;
      box-shadow:0 8px 20px rgba(0,0,0,.05);
    }

    .product-card:hover{
      transform:translateY(-6px);
      box-shadow:0 12px 26px rgba(0,0,0,.1);
    }

    .product-img{
  width:100%;
  height:320px;
  object-fit:contain;
  background:#fff;
  padding:10px;
}

    .product-info{
      padding:22px;
    }

    .product-name{
      font-size:30px;
      font-weight:700;
      margin-bottom:8px;
    }

    .product-desc{
      font-size:14px;
      color:#888;
      margin-bottom:18px;
    }

    .product-price{
      color:#ff3b30;
      font-size:42px;
      font-weight:700;
      margin-bottom:18px;
    }

    .product-price span{
      font-size:22px;
    }

    .product-tags{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .tag{
      background:#f7f3eb;
      color:#6b4f2d;
      padding:6px 12px;
      border-radius:999px;
      font-size:12px;
    }

    /* 底部 */
    .footer{
      margin-top:80px;
      background:#111;
      color:#fff;
      padding:22px 0;
    }

    .footer-content{
      display:flex;
      justify-content:center;
      gap:40px;
      font-size:14px;
      opacity:.9;
    }

    /* 响应式 */
    @media(max-width:1200px){
      .container{
        width:94%;
      }

      .product-list{
        grid-template-columns:repeat(3,1fr);
      }
    }

    @media(max-width:768px){

      .title{
        font-size:46px;
      }

      .features{
        flex-direction:column;
        align-items:center;
        gap:25px;
      }

      .product-list{
        grid-template-columns:repeat(2,1fr);
      }

      .section-title::before,
      .section-title::after{
        display:none;
      }
    }

    @media(max-width:500px){

      .product-list{
        grid-template-columns:1fr;
      }

      .title{
        font-size:36px;
      }
    }

  </style>
</head>

<body>

  <!-- 顶部Banner -->
  <section class="hero">
    <div class="container">

      <h1 class="title">奥莱海外仓</h1>

      <div class="features">

        <div class="feature-item">
          <div class="feature-icon">📦</div>

          <div class="feature-text">
            <h4>仓库直发</h4>
            <p>快速配送 高效发货</p>
          </div>
        </div>

        <div class="feature-item">
          <div class="feature-icon">✔</div>

          <div class="feature-text">
            <h4>官方正品</h4>
            <p>严格品控 假一赔十</p>
          </div>
        </div>

        <div class="feature-item">
          <div class="feature-icon">☎</div>

          <div class="feature-text">
            <h4>专业服务</h4>
            <p>专属客服 售后无忧</p>
          </div>
        </div>

      </div>

      <h2 class="section-title">精选推荐</h2>

      <!-- 商品列表 -->
      <div class="product-list">

        <div class="product-card">
          <img class="product-img"
            src="images/tuxing.jpg"
            alt="失落土星">

          <div class="product-info">
            <div class="product-name">土星系列</div>

            <div class="product-price">
              <span>¥</span>599
            </div>

            <div class="product-tags">
              <div class="tag">官方正品</div>
              <div class="tag">仓库直发</div>
            </div>
          </div>
        </div>

        <div class="product-card">
          <img class="product-img"
            src="images/shanchahua.jpg"
            alt="山茶花">

          <div class="product-info">
            <div class="product-name">山茶花系列</div>
            <div class="product-desc">经典款</div>

            <div class="product-price">
              <span>¥</span>499
            </div>

            <div class="product-tags">
              <div class="tag">官方正品</div>
              <div class="tag">仓库直发</div>
            </div>
          </div>
        </div>

        <div class="product-card">
          <img class="product-img"
            src="images/zanhua.jpg"
            alt="簪花">

          <div class="product-info">
            <div class="product-name">簪花系列</div>
            <div class="product-desc">百搭款</div>

            <div class="product-price">
              <span>¥</span>399
            </div>

            <div class="product-tags">
              <div class="tag">官方正品</div>
              <div class="tag">仓库直发</div>
            </div>
          </div>
        </div>

        <div class="product-card">
          <img class="product-img"
            src="images/yindie.jpg"
            alt="银蝶">

          <div class="product-info">
            <div class="product-name">银蝶系列</div>
            <div class="product-desc">优雅款</div>

            <div class="product-price">
              <span>¥</span>459
            </div>

            <div class="product-tags">
              <div class="tag">官方正品</div>
              <div class="tag">仓库直发</div>
            </div>
          </div>
        </div>

        <div class="product-card">
          <img class="product-img"
            src="images/chuju.jpg"
            alt="小雏菊">

          <div class="product-info">
            <div class="product-name">小雏菊</div>
            <div class="product-desc">新款</div>

            <div class="product-price">
              <span>¥</span>549
            </div>

            <div class="product-tags">
              <div class="tag">官方正品</div>
              <div class="tag">仓库直发</div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </section>

  <!-- 底部 -->
  <footer class="footer">
    <div class="footer-content">
      <span>© 2026 奥莱海外仓</span>
      <span>官方正品保障</span>
      <span>7天无忧售后</span>
    </div>
  </footer>

</body>
</html>
